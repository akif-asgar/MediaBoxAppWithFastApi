services:
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: mediabox_backend
    restart: always
    ports:
      - "8081:8000"
    env_file:
      - .env
    volumes:
      - ./media.db:/app/media.db
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend  # Burada ancaq ./frontend yazın, əlavə qovluq yazmayın
    container_name: mediabox_frontend
    restart: always
    ports:
      - "3000:5173"
    depends_on:
      - backend